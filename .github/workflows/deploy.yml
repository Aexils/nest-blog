name: Build NestJS and Upload ZIP to S3

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  BUILD_DIR: dist
  ZIP_NAME: lambda.zip

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Build NestJS project
        run: npm run build

      - name: 📁 Create Lambda ZIP
        run: |
          mkdir -p lambda
          cp -r dist node_modules package.json lambda/
          cd lambda
          zip -r ../$ZIP_NAME .
          cd ..
        shell: bash

      - name: ☁️ Upload to S3
        run: |
          aws s3 cp lambda.zip s3://${{ secrets.S3_BUCKET_NAME }}/lambda.zip --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: 🌀 Update Lambda Code
        run: |
          aws lambda update-function-code \
            --function-name aexils-prod-backend \
            --s3-bucket ${{ secrets.S3_BUCKET_NAME }} \
            --s3-key ${{ env.ZIP_NAME }} \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
